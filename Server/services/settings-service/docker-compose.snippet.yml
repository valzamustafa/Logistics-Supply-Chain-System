

version: '3.8'

services:
  # Settings Service
  settings-service:
    build:
      context: ./Server/services/settings-service
      dockerfile: Dockerfile
    container_name: logjistika-settings-service
    ports:
      - "5011:80"
      - "7011:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=SettingsServiceDB;User Id=sa;Password=${SA_PASSWORD};
      - JwtSettings__Secret=${JWT_SECRET}
    depends_on:
      - sql-server
    networks:
      - logjistika-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  logjistika-network:
    driver: bridge

